spring.application.name=postgresql-jpa-hibernate
server.port=8080

# DataSource means the database connection configuration used by Spring Boot.
# Spring Boot reads spring.datasource.* and creates a DataSource bean, usually backed by a connection pool.
# JPA/Hibernate then uses that DataSource whenever repository methods need to run SQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# ddl-auto controls whether Hibernate actually touches the database schema:
# none  	Does nothing - you manage schema yourself (e.g. via Flyway/Liquibase)
# validate	Checks entities match existing tables, throws error if not, creates nothing
# update	Creates missing tables/columns, never deletes/modifies existing ones safely
# create	Drops and recreates schema every startup
# create-drop	Same as create, plus drops schema on shutdown
spring.jpa.hibernate.ddl-auto=update

# show-sql prints Hibernate-generated SQL statements in the application logs.
spring.jpa.show-sql=true
# format_sql pretty-prints the SQL shown in logs across multiple lines.
spring.jpa.properties.hibernate.format_sql=true
