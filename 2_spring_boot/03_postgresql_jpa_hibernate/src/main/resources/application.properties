spring.application.name=postgresql-jpa-hibernate
server.port=8080

# PostgreSQL connection used by Spring Boot's DataSource auto-configuration.
# These values match the local PostgreSQL server you connect to from pgAdmin.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate is the JPA provider. update creates/adjusts tables for study projects,
# but production apps usually use migrations such as Flyway or Liquibase instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
