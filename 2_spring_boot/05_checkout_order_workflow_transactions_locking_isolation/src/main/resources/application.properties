spring.application.name=checkout-order-workflow-transactions
server.port=8080

# Local PostgreSQL connection. This module uses separate *_05_checkout tables so it can run beside 03/04.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# Learning setting only. In production use Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL so transaction workflow effects are visible in logs.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Keep lazy loading inside service transactions. REST response rendering should not run hidden SQL.
spring.jpa.open-in-view=false
