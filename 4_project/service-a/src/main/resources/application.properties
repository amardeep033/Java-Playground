spring.application.name=service-a
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.properties.hibernate.default_schema=service_a
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Optional Base64-encoded 32-byte master key. Local development persists a generated key.
app.signing.encryption-key=${SIGNING_SECRET_ENCRYPTION_KEY:}
app.signing.key-file=${SIGNING_SECRET_KEY_FILE:.local/signing.key}


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3000
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.concurrency=4
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual
app.retry-delay-ms=${RABBITMQ_RETRY_DELAY_MS:30000}
app.outbox.poll-delay-ms=250

server.tomcat.threads.max=32

# Access JWT verification is stateless; refresh families are revocable in PostgreSQL.
app.auth.jwt-key=${AUTH_JWT_KEY:}
app.auth.key-file=${AUTH_KEY_FILE:.local/auth.key}
app.auth.token-minutes=${AUTH_TOKEN_MINUTES:15}
app.auth.refresh-days=${AUTH_REFRESH_DAYS:30}

app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# Private service-to-service REST; set the same credential in both services.
app.internal.token=${SERVICE_INTERNAL_TOKEN:}
app.internal.key-file=${SERVICE_INTERNAL_KEY_FILE:.local/internal.key}

# Completion projection repair: durable timestamp/UUID cursor, at most 100 rows per tick.
app.reconciliation.enabled=${RECONCILIATION_ENABLED:true}
app.reconciliation.service-b-url=${SERVICE_B_URL:http://127.0.0.1:8082}
app.reconciliation.poll-delay-ms=${RECONCILIATION_POLL_DELAY_MS:60000}
app.reconciliation.initial-delay-ms=${RECONCILIATION_INITIAL_DELAY_MS:60000}
app.reconciliation.batch-size=20
