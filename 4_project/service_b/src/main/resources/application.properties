spring.application.name=service-b
server.port=8082
server.address=127.0.0.1
server.tomcat.threads.max=16
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
app.signing.encryption-key=${SIGNING_SECRET_ENCRYPTION_KEY:}
app.signing.key-file=${SIGNING_SECRET_KEY_FILE:../service-a/.local/signing.key}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3000
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.concurrency=4
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual
app.retry-delay-ms=${RABBITMQ_RETRY_DELAY_MS:30000}
app.outbox.poll-delay-ms=250

# Private service-to-service REST; set the same credential in both services.
app.internal.token=${SERVICE_INTERNAL_TOKEN:}
app.internal.key-file=${SERVICE_INTERNAL_KEY_FILE:../service-a/.local/internal.key}
