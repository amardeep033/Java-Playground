# Application
spring.application.name=otel-demo
server.address=127.0.0.1
server.port=8080

# Application logging configuration
spring.main.banner-mode=off
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.structured.format.console=logstash

# Actuator configuration -- which endpoints to expose; by default, only health is exposed over HTTP.
management.endpoints.web.exposure.include=health,metrics,prometheus

# Micrometer and Prometheus configuration
# First, we say we need histogram buckets for the durations recorded in code under the meter name "orders.duration".
management.metrics.distribution.percentiles-histogram.orders.duration=true
# Then, for the same meter, we give the expected min/max for choosing buckets, not for limiting recorded values.
# We do not define x here -- the elapsed time recorded by the Timer in code becomes each observation x.
# We use ms/s because this measures time; units can be omitted here, but Timer bounds then default to ms.
management.metrics.distribution.minimum-expected-value.orders.duration=1ms
management.metrics.distribution.maximum-expected-value.orders.duration=2s
# Then, for the meter "orders.latency" recorded in code, we say we need local p50 and p95 values.
management.metrics.distribution.percentiles.orders.latency=0.5,0.95

# OpenTelemetry configuration
otel.service.name=otel-demo
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.endpoint=http://localhost:4318
# OTel traces configuration
otel.traces.exporter=otlp
otel.traces.sampler=always_on
otel.bsp.schedule.delay=1000
# No OTel metric export here, since Micrometer exposes the metrics in Prometheus format.
otel.metrics.exporter=none
# OTel logs configuration -- MDC (Mapped Diagnostic Context) lets us put IDs into the logging context so they appear in log messages automatically.
otel.logs.exporter=otlp
otel.blrp.schedule.delay=1000
otel.instrumentation.logback-appender.enabled=true
otel.instrumentation.logback-appender.experimental.capture-mdc-attributes=requestId,traceId,correlationId
otel.instrumentation.logback-appender.experimental.capture-key-value-pair-attributes=true

# MeterRegistry: meters are identified by name and tags and created on first use here.
# +-- "orders.requests" -- Counter: counts events, so it needs no distribution settings above.
# |       +-- outcome=success → Counter
# |       +-- outcome=error   → Counter
# +-- "orders.duration"
# |       +-- outcome=success → Timer with histogram buckets
# |       +-- outcome=error   → Timer with histogram buckets
# +-- "orders.latency"
#         +-- outcome=success → Timer with local p50/p95
#         +-- outcome=error   → Timer with local p50/p95

# Distribution settings use management.metrics.distribution.<property>.<meter-name>.
# For example: management.metrics.distribution.expiry.orders.latency=1m.
# Rolling windows apply to decaying statistics; Prometheus histogram bucket counts remain cumulative.
# | Property               | Expected type     | Example value | Meaning                                                                     |
# | ---------------------- | ----------------- | ------------- | --------------------------------------------------------------------------- |
# | percentiles            | Decimal list      | 0.5,0.95,0.99 | Estimate local p50, p95, p99; not aggregable across instances               |
# | percentiles-histogram  | Boolean           | true          | Publish histogram buckets for backend percentile estimation                 |
# | minimum-expected-value | Duration / number | 1ms / 10      | Expected lower bound for bucket selection; unitless Timer values use ms     |
# | maximum-expected-value | Duration / number | 2s / 20       | Expected upper bound for bucket selection; not a cap on observations        |
# | expiry                 | Duration          | 1m            | Rotation interval for decaying distribution statistics                      |
# | buffer-length          | Integer           | 3             | Rolling buffers retained; full window is expiry multiplied by buffer-length |
