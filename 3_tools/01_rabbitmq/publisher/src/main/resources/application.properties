spring.application.name=publisher
server.port=8080

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=learner
spring.rabbitmq.password=learner

# Track RabbitMQ publisher confirmations.
spring.rabbitmq.publisher-confirm-type=correlated
# Enable returned-message handling on the publishing connection/channel.
spring.rabbitmq.publisher-returns=true
# Request a return if no queue matches; application code checks it alongside the confirm.
spring.rabbitmq.template.mandatory=true
